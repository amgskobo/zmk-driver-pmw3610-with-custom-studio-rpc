name: Test ZMK Module

on:
  push:
    branches:
      - main
      - codex/pmw3610-driver-review
    paths-ignore:
      - "**/*.md"
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/devcontainer.yml
      - .github/workflows/claude.yml
      - .github/workflows/codex.yml
      - .github/workflows/template-sync.yml
      - .github/workflows/web-ui.yml
      - .github/actions/zmk-env/**
      - .gitignore
      - .claude/**
      - .codex/**
      - "LICENSE"
      - "web/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/devcontainer.yml
      - .github/workflows/claude.yml
      - .github/workflows/codex.yml
      - .github/workflows/template-sync.yml
      - .github/workflows/web-ui.yml
      - .github/actions/zmk-env/**
      - .gitignore
      - .claude/**
      - .codex/**
      - "LICENSE"
      - "web/**"
  workflow_dispatch:
  schedule:
    # 20:00 JST every Friday (11:00 UTC)
    - cron: "0 11 * * 5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
      options: --cpus 2 --memory 4g
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/west-init
      - name: Test
        run: python3 -m unittest -v
      - name: Upload Build Artifacts
        if: ${{ github.ref != 'refs/heads/codex/pmw3610-driver-review' }}
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware
          path: |
            build/*/zephyr/zmk.uf2

  renode-test:
    runs-on: ubuntu-latest
    # Building the renode artifact + installing Renode (cached after the
    # first run) + booting the emulator takes longer than a plain build.
    timeout-minutes: 20
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
      options: --cpus 2 --memory 4g
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    name: Renode PMW3610 Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/west-init
      - name: Build Renode firmware
        # Emulation-only image (PMW3610 driver + console over a real UART, no
        # Studio); see tests/zmk-config/build-renode.yaml. Writes build/renode/.
        run: >-
          west zmk-build tests/zmk-config
          --build-yaml tests/zmk-config/build-renode.yaml -af renode --parallelism 1
      - name: Cache Renode install
        uses: actions/cache@v4
        with:
          path: ~/.renode
          key: renode-1.16.1-${{ runner.os }}
      - name: Prepare Renode test environment
        run: |
          if ! python3 -c 'import google.protobuf' || ! command -v protoc; then
            apt-get update -y
            apt-get install -y --no-install-recommends python3-protobuf protobuf-compiler
          fi
          python3 tools/renode_core.py prepare --cache "$RUNNER_TEMP/pmw-renode-core" --jobs 2
      - name: Run Renode PMW3610 test
        # This console-only image uses the module's sensor platform. The
        # generic smoke has no sensor and is not this image's acceptance test.
        run: >-
          python3 tools/renode_core.py run --cache "$RUNNER_TEMP/pmw-renode-core" --
          west zmk-renode-test tests/renode
          --elf build/renode/zephyr/zmk.elf --renode-version 1.16.1 --skip-smoke

  renode-relay-test:
    runs-on: ubuntu-latest
    # Two real images booted on one Renode session + the Renode install.
    timeout-minutes: 20
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
      options: --cpus 2 --memory 4g
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    name: Renode PMW3610 wired-split relay test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/west-init
      - name: Build usb+wired split halves
        # The Studio central + the split peripheral carrying the simulated
        # PMW3610; see tests/zmk-config/build-usb-split.yaml.
        run: >-
          west zmk-build tests/zmk-config
          --build-yaml tests/zmk-config/build-usb-split.yaml -af usb-wired-central --parallelism 1 &&
          west zmk-build tests/zmk-config
          --build-yaml tests/zmk-config/build-usb-split.yaml -af usb-wired-peripheral --parallelism 1
      - name: Cache Renode install
        uses: actions/cache@v4
        with:
          path: ~/.renode
          key: renode-1.16.1-${{ runner.os }}
      - name: Prepare Renode test environment
        run: |
          if ! python3 -c 'import google.protobuf' || ! command -v protoc; then
            apt-get update -y
            apt-get install -y --no-install-recommends python3-protobuf protobuf-compiler
          fi
          python3 tools/renode_core.py prepare --cache "$RUNNER_TEMP/pmw-renode-core" --jobs 2
      - name: Run split-relay round-trip test
        # Keep the three generic wired smoke checks as well as the module tests.
        run: >-
          python3 tools/renode_core.py run --cache "$RUNNER_TEMP/pmw-renode-core" --
          west zmk-renode-test --mode wired-split
          --elf build/usb-wired-central/zephyr/zmk.elf
          --peripheral-elf build/usb-wired-peripheral/zephyr/zmk.elf
          tests/renode --renode-version 1.16.1

  keepalive:
    if: github.event_name == 'schedule'
    permissions: write-all
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Re-enable workflow to avoid deactivating scheduled runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_REPO: ${{ github.repository }}
        run: |
          gh workflow enable zmk-module.yml
